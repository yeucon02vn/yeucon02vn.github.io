name: Deploy download page to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into index.html
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          FILE_URL: ${{ secrets.FILE_URL }}
        run: |
          if [ -z "$APP_PASSWORD" ]; then
            echo "::error::Missing Actions secret APP_PASSWORD (repo Settings > Secrets and variables > Actions)"
            exit 1
          fi
          python3 - <<'EOF'
          import os
          p = 'index.html'
          s = open(p, encoding='utf-8').read()
          s = s.replace('__APP_PASSWORD__', os.environ['APP_PASSWORD'])
          if os.environ.get('FILE_URL'):
              s = s.replace('__FILE_URL__', os.environ['FILE_URL'])
          open(p, 'w', encoding='utf-8').write(s)
          EOF
          if grep -q '__APP_PASSWORD__' index.html; then
            echo "::error::Password placeholder was not replaced"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
