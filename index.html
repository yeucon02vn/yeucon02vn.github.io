<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tải AutoTool-Friend v1.8</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 28px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p.sub { color: #94a3b8; margin: 0 0 18px; font-size: 14px; }
  .filebox { background: #0f172a; border: 1px dashed #475569; border-radius: 10px; padding: 12px; font-size: 13px; margin-bottom: 18px; word-break: break-all; }
  input[type=password], input[type=text] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; }
  button, a.btn { display: inline-block; width: 100%; margin-top: 12px; padding: 13px; border-radius: 10px; border: 0; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn-primary { background: #22c55e; color: #052e16; }
  .btn-primary:hover { background: #16a34a; color: #fff; }
  .btn-copy { background: #334155; color: #fff; font-size: 14px; }
  #qrcode { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; margin: 16px 0 6px; }
  #qrcode img, #qrcode canvas { display: block; }
  .url { font-size: 12px; color: #94a3b8; word-break: break-all; margin-top: 8px; }
  .hidden { display: none; }
  .note { font-size: 12px; color: #64748b; margin-top: 16px; }
  .err { color: #f87171; font-size: 13px; margin-top: 8px; min-height: 18px; }
</style>
</head>
<body>
<div class="card">
  <h1>📦 AutoTool-Friend v1.8</h1>
  <p class="sub">Quét QR hoặc bấm nút để tải file</p>

  <div id="main">
    <div class="filebox" id="fileinfo">Đang tải thông tin file...</div>
    <div id="qrcode"></div>
    <div class="url" id="fileurl"></div>
    <button class="btn-copy" onclick="copyLink()">📋 Copy link tải</button>
    <a class="btn btn-primary" id="downloadBtn" href="#" download>⬇️ Download file Zip</a>
    <p class="note">Quét QR bằng điện thoại để tải.</p>
  </div>
</div>

<script>
  // ===== CẤU HÌNH =====
  // Link file TU DONG lay tu Release moi nhat cua repo (qua GitHub API),
  // ra ban moi chi can up Release, khong can sua web.
  // Muon khoa cung 1 ban cu the thi dan URL vao FILE_URL.
  const REPO = "yeucon02vn/yeucon02vn.github.io";
  const FILE_URL = "";
  const FILE_SIZE_TEXT = "26.3 MB";
  // ====================

  function cfg(v) { return (v && v.indexOf("__") !== 0) ? v : ""; }

  async function getFile() {
    if (cfg(FILE_URL)) return { url: FILE_URL, name: "AutoTool-Friend-v1.8.zip" };
    try {
      const r = await fetch("https://api.github.com/repos/" + REPO + "/releases/latest");
      if (!r.ok) throw 0;
      const j = await r.json();
      const assets = j.assets || [];
      const a = assets.find(function(x){ return /\.zip$/i.test(x.name); }) || assets[0];
      if (a) return { url: a.browser_download_url, name: a.name, size: a.size };
    } catch (e) {}
    const base = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
    return { url: base + "AutoTool-Friend-v1.8.zip", name: "AutoTool-Friend-v1.8.zip" };
  }

  async function showDownload() {
    document.getElementById('fileinfo').textContent = '⏳ Đang lấy link tải mới nhất...';
    const f = await getFile();
    const sizeText = f.size ? (f.size / 1048576).toFixed(1) + ' MB' : FILE_SIZE_TEXT;
    document.getElementById('fileinfo').innerHTML = '📁 ' + f.name + '<br/>Dung lượng: ' + sizeText;
    document.getElementById('fileurl').textContent = f.url;
    const btn = document.getElementById('downloadBtn');
    btn.href = f.url;
    btn.setAttribute('download', f.name);
    document.getElementById('qrcode').innerHTML = '';
    new QRCode(document.getElementById('qrcode'), {
      text: f.url,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  function copyLink() {
    const t = document.getElementById('fileurl').textContent;
    navigator.clipboard.writeText(t).then(function(){ alert('Đã copy link!'); });
  }

  showDownload();
</script>
</body>
</html>
