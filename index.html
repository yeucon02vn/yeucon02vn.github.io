<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kho file AutoTool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 20px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; max-width: 560px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  h1 { margin: 0 0 4px; font-size: 22px; text-align: center; }
  p.sub { color: #94a3b8; margin: 0 0 12px; font-size: 14px; text-align: center; }
  .ownerrow { text-align: center; margin-bottom: 6px; }
  .ownerrow button { background: transparent; border: 1px solid #475569; color: #94a3b8; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .ownerrow button.on { border-color: #22c55e; color: #22c55e; }
  h2 { font-size: 14px; color: #94a3b8; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .5px; }
  .fileitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
  .fileitem:hover { border-color: #22c55e; }
  .fileitem.active { border-color: #22c55e; background: #052e16; }
  .fileitem .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fileitem .sz { color: #94a3b8; font-size: 12px; white-space: nowrap; }
  .badge { font-size: 11px; background: #334155; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  .badge.local { background: #7c3aed; }
  .empty { color: #64748b; font-size: 13px; text-align: center; padding: 8px; }
  hr { border: 0; border-top: 1px solid #334155; margin: 18px 0; }
  .filebox { background: #0f172a; border: 1px dashed #475569; border-radius: 10px; padding: 12px; font-size: 13px; margin-bottom: 6px; word-break: break-all; text-align: center; }
  button, a.btn, label.btn { display: inline-block; width: 100%; margin-top: 12px; padding: 13px; border-radius: 10px; border: 0; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; }
  .btn-primary { background: #22c55e; color: #052e16; }
  .btn-primary:hover { background: #16a34a; color: #fff; }
  .btn-copy { background: #334155; color: #fff; font-size: 14px; }
  .btn-danger { background: transparent; border: 1px solid #7f1d1d; color: #f87171; font-size: 13px; padding: 9px; }
  #qrcode { background: #fff; padding: 12px; border-radius: 12px; display: block; width: fit-content; margin: 16px auto 6px; }
  #qrcode img, #qrcode canvas { display: block; }
  .url { font-size: 12px; color: #94a3b8; word-break: break-all; margin-top: 8px; text-align: center; }
  .note { font-size: 12px; color: #64748b; margin-top: 16px; text-align: center; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>📦 Kho file AutoTool</h1>
  <p class="sub">Bấm vào file để lấy QR / tải xuống</p>
  <div class="ownerrow"><button id="tokBtn" onclick="tokToggle()">🔑 Kết nối GitHub để upload lên Releases</button></div>

  <h2>File trên Releases</h2>
  <div id="relList"><div class="empty">⏳ Đang tải danh sách...</div></div>

  <h2>File upload trên máy này</h2>
  <div id="localList"><div class="empty">Chưa có file nào</div></div>
  <label class="btn btn-copy" for="up">⬆️ Upload file</label>
  <input type="file" id="up" multiple hidden />
  <div class="empty" id="upStatus"></div>

  <hr/>

  <div id="detail" class="hidden">
    <div class="filebox" id="fileinfo"></div>
    <div id="qrcode"></div>
    <div class="url" id="fileurl"></div>
    <button class="btn-copy" onclick="copyLink()">📋 Copy link</button>
    <a class="btn btn-primary" id="downloadBtn" href="#" download>⬇️ Download</a>
    <button class="btn-danger hidden" id="delBtn" onclick="delFile()">🗑 Xóa file này</button>
  </div>
  <p class="note" id="detailNote">Chọn 1 file ở trên để hiện QR + nút tải.<br/>Chưa kết nối GitHub thì file upload chỉ lưu trong trình duyệt máy này.</p>
</div>

<script>
  // Repo lay danh sach file tu muc Assets cua cac Release.
  // Upload thang len Releases can token (chi chu web nhap tren may minh).
  const REPO = "yeucon02vn/yeucon02vn.github.io";
  const STORE_TAG = "kho-file";
  let files = [];
  let selectedId = null;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function fmtSize(b) {
    if (b == null) return "";
    if (b < 1048576) return Math.max(1, Math.round(b / 1024)) + " KB";
    return (b / 1048576).toFixed(1) + " MB";
  }
  function token() { return localStorage.getItem("gh_token") || ""; }

  async function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Accept": "application/vnd.github+json" }, opts.headers || {});
    const t = token();
    if (t) opts.headers["Authorization"] = "Bearer " + t;
    return fetch("https://api.github.com" + path, opts);
  }

  // ---------- Owner: nhap / xoa token ----------
  async function tokToggle() {
    if (token()) {
      if (!confirm("Ngắt kết nối GitHub trên máy này?")) return;
      localStorage.removeItem("gh_token");
      paintTok();
      return;
    }
    const t = prompt("Dán GitHub token (Settings > Developer settings > Personal access tokens).\nToken cần quyền Contents read+write cho repo này.\nChỉ nhập trên máy của bạn:");
    if (!t) return;
    localStorage.setItem("gh_token", t.trim());
    try {
      const r = await api("/repos/" + REPO);
      if (!r.ok) throw 0;
      alert("Kết nối thành công! Giờ upload sẽ đẩy thẳng lên Releases.");
    } catch (e) {
      localStorage.removeItem("gh_token");
      alert("Token không dùng được, kiểm tra lại quyền.");
    }
    paintTok();
  }
  function paintTok() {
    const b = document.getElementById("tokBtn");
    const on = !!token();
    b.textContent = on ? "🔑 Đã kết nối GitHub (bấm để ngắt)" : "🔑 Kết nối GitHub để upload lên Releases";
    b.classList.toggle("on", on);
  }

  // ---------- Luu file upload vao trinh duyet (khi chua co token) ----------
  function idb() {
    return new Promise(function(res, rej) {
      const q = indexedDB.open("filekho", 1);
      q.onupgradeneeded = function() { q.result.createObjectStore("files", { keyPath: "id" }); };
      q.onsuccess = function() { res(q.result); };
      q.onerror = function() { rej(q.error); };
    });
  }
  async function idbAll() {
    const db = await idb();
    return new Promise(function(res, rej) {
      const q = db.transaction("files").objectStore("files").getAll();
      q.onsuccess = function() { res(q.result || []); };
      q.onerror = function() { rej(q.error); };
    });
  }
  async function idbPut(rec) {
    const db = await idb();
    return new Promise(function(res, rej) {
      const q = db.transaction("files", "readwrite").objectStore("files").put(rec);
      q.onsuccess = function() { res(); };
      q.onerror = function() { rej(q.error); };
    });
  }
  async function idbDel(id) {
    const db = await idb();
    return new Promise(function(res, rej) {
      const q = db.transaction("files", "readwrite").objectStore("files").delete(id);
      q.onsuccess = function() { res(); };
      q.onerror = function() { rej(q.error); };
    });
  }

  // ---------- Nap danh sach ----------
  async function load() {
    const rel = [];
    try {
      const r = await fetch("https://api.github.com/repos/" + REPO + "/releases?per_page=100");
      if (r.ok) {
        const js = await r.json();
        js.forEach(function(rl) {
          (rl.assets || []).forEach(function(a) {
            rel.push({ id: "rel-" + a.id, assetId: a.id, name: a.name, size: a.size, url: a.browser_download_url, tag: rl.tag_name, local: false });
          });
        });
      }
    } catch (e) {}
    let local = [];
    try {
      const recs = await idbAll();
      local = recs.map(function(x) {
        return { id: x.id, name: x.name, size: x.size, url: URL.createObjectURL(x.blob), tag: "máy này", local: true };
      });
    } catch (e) {}
    files = rel.concat(local);
    renderLists();
    if (files.length && !files.some(function(f){ return f.id === selectedId; })) {
      select(files[0].id);
    } else if (!files.length) {
      document.getElementById("detail").classList.add("hidden");
    }
  }

  function renderLists() {
    const rel = files.filter(function(f){ return !f.local; });
    const loc = files.filter(function(f){ return f.local; });
    document.getElementById("relList").innerHTML = rel.length
      ? rel.map(itemHtml).join("")
      : '<div class="empty">Chưa có file nào trên Releases</div>';
    document.getElementById("localList").innerHTML = loc.length
      ? loc.map(itemHtml).join("")
      : '<div class="empty">Chưa có file nào</div>';
  }

  function itemHtml(f) {
    return '<button class="fileitem' + (f.id === selectedId ? " active" : "") + '" onclick="select(\'' + f.id + '\')">'
      + '<span class="nm">📁 ' + esc(f.name) + '</span>'
      + '<span class="sz">' + esc(fmtSize(f.size)) + '</span>'
      + '<span class="badge' + (f.local ? " local" : "") + '">' + esc(f.tag) + '</span>'
      + '</button>';
  }

  function select(id) {
    selectedId = id;
    const f = files.find(function(x){ return x.id === id; });
    if (!f) return;
    renderLists();
    document.getElementById("detail").classList.remove("hidden");
    document.getElementById("detailNote").classList.add("hidden");
    document.getElementById("fileinfo").innerHTML = "📁 " + esc(f.name) + "<br/>Dung lượng: " + esc(fmtSize(f.size)) + (f.local ? "" : "<br/>Bản: " + esc(f.tag));
    document.getElementById("fileurl").textContent = f.url;
    const btn = document.getElementById("downloadBtn");
    btn.href = f.url;
    btn.setAttribute("download", f.name);
    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), { text: f.url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
    document.getElementById("delBtn").classList.toggle("hidden", !(f.local || token()));
  }

  function copyLink() {
    const t = document.getElementById("fileurl").textContent;
    navigator.clipboard.writeText(t).then(function(){ alert("Đã copy link!"); });
  }

  async function delFile() {
    const f = files.find(function(x){ return x.id === selectedId; });
    if (!f || !confirm("Xóa file \"" + f.name + "\"?")) return;
    if (f.local) {
      if (f.url.indexOf("blob:") === 0) URL.revokeObjectURL(f.url);
      await idbDel(f.id);
    } else {
      const r = await api("/repos/" + REPO + "/releases/assets/" + f.assetId, { method: "DELETE" });
      if (!r.ok) { alert("Xóa thất bại, kiểm tra token."); return; }
    }
    selectedId = null;
    document.getElementById("detail").classList.add("hidden");
    document.getElementById("detailNote").classList.remove("hidden");
    load();
  }

  // ---------- Upload thang len Releases (can token) ----------
  async function ensureRelease() {
    let r = await api("/repos/" + REPO + "/releases/tags/" + STORE_TAG);
    if (r.ok) return r.json();
    r = await api("/repos/" + REPO + "/releases", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tag_name: STORE_TAG, name: "Kho file" })
    });
    if (!r.ok) throw new Error("Không tạo được release");
    return r.json();
  }

  function uploadAsset(uploadUrl, file, onprog) {
    return new Promise(function(res, rej) {
      const url = uploadUrl.split("{")[0] + "?name=" + encodeURIComponent(file.name);
      const x = new XMLHttpRequest();
      x.open("POST", url);
      x.setRequestHeader("Authorization", "Bearer " + token());
      x.setRequestHeader("Content-Type", "application/octet-stream");
      x.upload.onprogress = function(e) { if (e.lengthComputable) onprog(Math.round(e.loaded / e.total * 100)); };
      x.onload = function() {
        if (x.status < 300) { try { res(JSON.parse(x.responseText)); } catch (e) { rej(new Error("Lỗi server")); } }
        else rej(new Error(x.status + " " + x.responseText));
      };
      x.onerror = function() { rej(new Error("Lỗi mạng")); };
      x.send(file);
    });
  }

  async function uploadToRelease(file, onprog) {
    const rel = await ensureRelease();
    try {
      return await uploadAsset(rel.upload_url, file, onprog);
    } catch (e) {
      if (String(e.message).indexOf("already_exists") === -1) throw e;
      const r = await api("/repos/" + REPO + "/releases/" + rel.id + "/assets?per_page=100");
      const js = await r.json();
      const same = (js || []).find(function(a){ return a.name === file.name; });
      if (same) await api("/repos/" + REPO + "/releases/assets/" + same.id, { method: "DELETE" });
      return await uploadAsset(rel.upload_url, file, onprog);
    }
  }

  function upStatus(t) { document.getElementById("upStatus").textContent = t; }

  document.getElementById("up").addEventListener("change", async function(e) {
    const list = Array.from(e.target.files || []);
    e.target.value = "";
    if (!list.length) return;
    if (token()) {
      for (let i = 0; i < list.length; i++) {
        const fl = list[i];
        try {
          upStatus("⏳ Đang upload " + fl.name + "... 0%");
          await uploadToRelease(fl, function(p) { upStatus("⏳ Đang upload " + fl.name + "... " + p + "%"); });
        } catch (err) {
          upStatus("❌ " + fl.name + ": " + err.message);
          return;
        }
      }
      upStatus("✅ Upload xong!");
      await load();
      setTimeout(function(){ upStatus(""); }, 3000);
    } else {
      for (let i = 0; i < list.length; i++) {
        const fl = list[i];
        await idbPut({ id: "local-" + Date.now() + "-" + i, name: fl.name, size: fl.size, blob: fl });
      }
      await load();
      const loc = files.filter(function(f){ return f.local; });
      if (loc.length) select(loc[loc.length - 1].id);
    }
  });

  paintTok();
  load();
</script>
</body>
</html>
